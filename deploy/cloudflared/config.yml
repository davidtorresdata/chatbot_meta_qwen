# Cloudflare Tunnel config used when cloudflared runs as a Docker container
# (docker-compose.tunnel.yml). Keep Caddy in local mode (CADDY_DOMAIN unset);
# the tunnel forwards HTTPS -> http://caddy:8080 inside the compose network.
tunnel: fertrac
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: bot.fertrac.com
    service: http://caddy:8080
  - service: http_status:404
