# Cloudflare Tunnel config used when cloudflared runs as a Docker container
# (docker-compose.tunnel.yml). Keep Caddy in local mode (CADDY_DOMAIN unset) and
# let the tunnel forward HTTPS -> http://host.docker.internal:8080 (Caddy).
tunnel: fertrac
credentials-file: /home/nonroot/.cloudflared/3b788127-936d-464a-a4ba-b84854d68e45.json

ingress:
  - hostname: bot.fertrac.com
    service: http://host.docker.internal:8080
  - service: http_status:404
