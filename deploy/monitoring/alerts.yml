groups:
  - name: metabot
    rules:
      - alert: MetaBotDown
        expr: up{job="metabot"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Meta bot instance down ({{ $labels.instance }})"}

      - alert: MetaBotQueueBacklog
        expr: max(metabot_queue_pending) > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Queue backlog above 100 messages for 5 minutes"}

      - alert: MetaBotMessagesRejected
        expr: sum(rate(metabot_messages_rejected_total{reason="full"}[5m])) > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Queue full: customers are receiving the busy message"}

      - alert: MetaBotLLMCircuitOpen
        expr: max(metabot_circuit_open{name="llm"}) == 1
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "LLM circuit breaker open: every answer is a fallback"}

      - alert: MetaBotSlowReplies
        expr: histogram_quantile(0.95, sum by (le) (rate(metabot_processing_seconds_bucket[10m]))) > 60
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 processing time above 60 s"}

      - alert: MetaBotHighFallbackRate
        expr: >
          sum(rate(metabot_messages_processed_total{action="fallback"}[30m]))
          / clamp_min(sum(rate(metabot_messages_processed_total[30m])), 1e-9) > 0.5
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "More than 50% of answers are fallbacks (knowledge gaps?)"}

      - alert: MetaBotSendErrors
        expr: sum(rate(metabot_meta_send_errors_total[5m])) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Meta Graph API send errors (token expired? quota?)"}
