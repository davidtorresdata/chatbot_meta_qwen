# Cloudflare Tunnel overlay: exposes the bot on a real HTTPS domain
# (e.g. bot.fertrac.com) even behind NAT/CGNAT. Cloudflare terminates TLS at the
# edge and connects to Caddy (local mode) through the compose network.
#
# One-time setup (host):
#   cloudflared tunnel login
#   cloudflared tunnel create fertrac
#   cloudflared tunnel route dns fertrac bot.fertrac.com
# Then in .env:
#   CLOUDFLARED_CREDENTIALS_FILE=<path to the generated <tunnel-id>.json>
#     Windows example: C:/Users/<you>/.cloudflared/<tunnel-id>.json
#     Linux example:   /home/<you>/.cloudflared/<tunnel-id>.json
# and adjust tunnel/hostname in deploy/cloudflared/config.yml.
# The credentials file is a secret: never commit it.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml -f docker-compose.tunnel.yml up -d
services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.1}
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS_FILE:?set CLOUDFLARED_CREDENTIALS_FILE in .env}:/etc/cloudflared/credentials.json:ro
    depends_on:
      - caddy
