# Monitoring overlay: Prometheus (scrapes /metrics) + Grafana (pre-provisioned
# datasource and "Meta Bot" dashboard).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   Grafana:    http://localhost:3000  (admin / GRAFANA_ADMIN_PASSWORD from .env)
#   Prometheus: http://localhost:9090
# Both are bound to 127.0.0.1: publish them only behind an authenticated proxy/VPN.

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.14.0}
    container_name: metabot-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - chatbot

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.1}
    container_name: metabot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
