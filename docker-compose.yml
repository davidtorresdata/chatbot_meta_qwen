services:
  chatbot:
    build: .
    container_name: whatsapp-qwen-chatbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      LOG_DIR: /app/logs
      # Ollama's OpenAI-compatible API inside the Docker network.
      LLM_BASE_URL: http://ollama:11434/v1
      EMBEDDING_BASE_URL: http://ollama:11434/v1
    ports:
      - "8000:8000"
    volumes:
      # Local LanceDB knowledge base (persistent, scales locally)
      - ./data:/app/data
      # Live-mount documents and config so you can edit them without rebuilds
      - ./knowledge_base:/app/knowledge_base
      - ./config:/app/config
      - ./scripts:/app/scripts
      # Editable conversation tree (no rebuild needed after edits)
      - ./tree.md:/app/tree.md
      # Persistent action logs: wa_ollama_logs_<timestamp>.txt, never deleted
      - ./logs:/app/logs
      # Google service-account key for the conversation registry (google_sheets
      # backend). Drop the .json file in deploy/credentials/ (see docs/CONVERSATION_REGISTRY.md)
      - ./deploy/credentials:/app/credentials
    # Cap Docker's internal JSON logs per container (rotation).
    # Live per-service capture: scripts/tail-logs.ps1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - ollama

  # Qwen 3.5 served by Ollama (OpenAI-compatible /v1).
  # This is the CPU-friendly default and also works on GPU hosts.
  # For GPU-only vLLM serving, see qwen-service/ (vllm + CUDA).
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    environment:
      # keep the model warm between messages instead of unloading after 5 min
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      # host 8001 -> container 11434 (matches LLM_BASE_URL default in .env)
      - "8001:11434"
    volumes:
      # persistent model store: download once, reuse on restarts
      - ./ollama-models:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # start the API, then pull the chat + embedding models (no-op once cached)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 3 && ollama pull qwen3.5:4b && ollama pull bge-m3 && wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
