services:
  chatbot:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    container_name: whatsapp-qwen-chatbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      # Ollama's OpenAI-compatible API inside the Docker network.
      LLM_BASE_URL: http://ollama:11434/v1
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      # Worker pool = parallel conversations. Keep equal to OLLAMA_NUM_PARALLEL.
      QUEUE_WORKERS: ${QUEUE_WORKERS:-2}
    ports:
      # Host-only. Public traffic must go through Caddy / Cloudflare Tunnel.
      - "127.0.0.1:8000:8000"
    volumes:
      # Local LanceDB knowledge base + conversation registry (persistent)
      - ./data:/app/data
      # Live-mount documents and config so you can edit them without rebuilds
      - ./knowledge_base:/app/knowledge_base
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      # Editable conversation tree (restart the chatbot after edits)
      - ./tree.md:/app/tree.md:ro
      # Rotated action logs (retention: LOG_RETENTION_DAYS)
      - ./logs:/app/logs
      # Google credentials for the registry (read-only; see docs/CONVERSATION_REGISTRY.md)
      - ./deploy/credentials:/app/credentials:ro
    # Graceful shutdown: stop intake, drain the queue (queue.drain_timeout_seconds).
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - ollama

  # Qwen served by Ollama (OpenAI-compatible /v1). CPU-friendly default.
  # For GPU-only vLLM serving, see qwen-service/ (vllm + CUDA).
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.34.3}
    container_name: ollama
    restart: unless-stopped
    environment:
      # keep the model warm between messages instead of unloading after 5 min
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Requests served in parallel per model (each one reserves context memory).
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      # Requests Ollama queues before answering 503 (our queue sits in front).
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-64}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    # No public port: Ollama has no authentication. Host-only for local tooling
    # (ingest/chat CLIs run on the host with LLM_BASE_URL=http://localhost:8001/v1).
    ports:
      - "127.0.0.1:8001:11434"
    volumes:
      # persistent model store: download once, reuse on restarts.
      # Not versioned (.gitignore): Ollama also keeps its private key here.
      - ./ollama-models:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # start the API, then pull the chat + embedding models (no-op once cached)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 3 && ollama pull ${LLM_MODEL:-qwen3.5:4b} && ollama pull ${EMBEDDING_MODEL:-bge-m3} && wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
